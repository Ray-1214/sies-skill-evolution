[pytest]
# --deselect：TestProfilerTagDriven::test_write_false_does_not_touch_disk 比對
# data/ability_profile_live.json 的 mtime 前後是否相同，用來證明 profiler 在
# write=False 下不寫磁碟。那個檔是長跑的執行期產物、不隨 repo 發布，所以在
# 乾淨 clone 上必然 FileNotFoundError。要跑它就先跑一次長跑把檔案生出來，
# 再用 `pytest --deselect= tests/...`（空值）或直接指定該 nodeid 覆蓋。
addopts = -p no:cacheprovider
          --deselect tests/test_p1_signals.py::TestProfilerTagDriven::test_write_false_does_not_touch_disk
testpaths = tests
norecursedirs = snapshots everything-claude-code superpowers .git
                __pycache__ .pytest_cache data skills memory
